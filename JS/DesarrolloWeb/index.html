<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desarrollo Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        button#temaBtn, button#fetchBtn {
            display: block;
        }
    </style>
</head>
<body>

    <h1>JavaScript para el Desarrollo Web</h1>

    <main class="container">
        <div class="row">
            <div class="col-sm border">
                <h2 class="text-center">Ejercicio práctico</h2>
                <h3 class="text-center">Temas: DOM, WebStorage, Fetch</h3>
            </div>
        </div>
        
        <div class="row">
            <!-- Botón 1: Cambiar Tema -->
            <div class="col-sm border p-3">
                <p class="text-center">Haz Click en el botón para cambiar el tema de la página.</p>
                <button id="temaBtn" type="button" class="btn btn-primary mx-auto">Cambia tema</button>
            </div>

            <!-- Botón 2: Fetch API (Cargar Productos) -->
            <div class="col-sm border p-3">
                <p class="text-center">Haz Click en el botón para cargar los productos de la tienda.</p>
                <button id="fetchBtn" type="button" class="btn btn-success mx-auto">Cargar Productos</button>
            </div>
        </div>

        <!-- Contenedor donde se cargarán las tarjetas de Bootstrap -->
        <div id="productosContainer" class="row my-4">
            <!-- Las tarjetas dinámicas se insertarán aquí -->
        </div>
    </main>

    <!-- Script principal como Módulo JS -->
    <script src="./js/main.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
